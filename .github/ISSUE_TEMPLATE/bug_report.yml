name: 错误报告 | Bug Report
description: 报告模组异常行为或崩溃问题 | Report abnormal behavior or crashes
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before reporting:**
        - Searched existing issues (including closed ones)  
        - Using latest mod and Fabric API  
        - Issue not marked as `wontfix`

  - type: textarea
    attributes:
      label: Description
      placeholder: |
        Example: Game crashes when placing block X near water
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction Steps
      description: Exact steps to trigger the bug
      placeholder: |
        1. Launch world with specific seed...
        2. Craft item Y using materials...
        3. Right-click on entity Z...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected vs Actual
      placeholder: |
        Expected: Should open GUI normally
        Actual: Game crashes with NullPointerException

  - type: input
    attributes:
      label: Minecraft Version
      placeholder: "e.g. 1.16.5"
    validations:
      required: true

  - type: input
    attributes:
      label: Mod Version
      description: |
        Provide the git commit if it is a prerelease.
      placeholder: "e.g. \"1.0.0\" \"8b4227\" "
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs
      placeholder: |
        Paste log files or log links here

  - type: textarea
    attributes:
      label: Installed Mods