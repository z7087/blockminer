name: ✨ Feature Request / 功能请求
description: Suggest new features or improvements / 提议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Please check first:**
        - This feature isn't requested in existing issues

  - type: textarea
    attributes:
      label: Feature Description
      description: What do you want to achieve?
      placeholder: "Ex: Add configurable item cooldowns"
    validations:
      required: true