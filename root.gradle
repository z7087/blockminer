plugins {
    id 'maven-publish'
    id 'fabric-loom' version '1.8.13' apply false

    // https://github.com/ReplayMod/preprocessor
    // https://github.com/Fallen-Breath/preprocessor
    id 'com.replaymod.preprocess' version '9d21b334a7'
}

preprocess {
    strictExtraMappings = false

    def mc_1_14_4  = createNode('1.14.4', 1_14_04, '')
    def mc_1_15_2  = createNode('1.15.2', 1_15_02, '')
    def mc_1_16_5  = createNode('1.16.5', 1_16_05, '')
    def mc_1_17_1  = createNode('1.17.1', 1_17_01, '')
    def mc_1_18_2  = createNode('1.18.2', 1_18_02, '')
    def mc_1_19_4  = createNode('1.19.4', 1_19_04, '')
    def mc_1_20_4 = createNode('1.20.4', 1_20_04, '')
    def mc_1_20_6 = createNode('1.20.6', 1_20_06, '')
    def mc_1_21_1 = createNode('1.21.1', 1_21_01, '')
    def mc_1_21_3 = createNode('1.21.3', 1_21_03, '')
    def mc_1_21_4 = createNode('1.21.4', 1_21_04, '')

    // back
    mc_1_18_2.link(mc_1_17_1 , null)
    mc_1_17_1.link(mc_1_16_5 , null)
    mc_1_16_5.link(mc_1_15_2 , null)
    mc_1_15_2.link(mc_1_14_4 , null)

    // forward
    mc_1_18_2.link(mc_1_19_4 , null)
    mc_1_19_4.link(mc_1_20_4, null)
    mc_1_20_4.link(mc_1_20_6, null)
    mc_1_20_6.link(mc_1_21_1, null)
    mc_1_21_1.link(mc_1_21_3, null)
    mc_1_21_3.link(mc_1_21_4, null)
}

tasks.register('buildAndGather') {
    subprojects {
        dependsOn project.tasks.named('build').get()
    }
    doFirst {
        println 'Gathering builds'
        def buildLibs = {
            p -> p.buildDir.toPath().resolve('libs')
        }
        delete fileTree(buildLibs(rootProject)) {
            include '*'
        }
        subprojects {
            copy {
                from(buildLibs(project)) {
                    include '*.jar'
                    exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
                }
                into buildLibs(rootProject)
                duplicatesStrategy DuplicatesStrategy.INCLUDE
            }
        }
    }
}
